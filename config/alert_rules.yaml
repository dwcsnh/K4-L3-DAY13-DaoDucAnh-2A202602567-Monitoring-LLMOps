alerts:
  - name: HighErrorRate
    severity: Critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: "#alerts"
    owner: SRE Team
    runbook: docs/alerts.md#alert-1
  - name: HighLatency
    severity: Warning
    condition: p95_latency > 3000
    duration: 5m
    type: symptom-based
    channel: "#alerts"
    owner: SRE Team
    runbook: docs/alerts.md#alert-2
  - name: LowQualityScore
    severity: Warning
    condition: quality_score_avg < 0.75
    duration: 10m
    type: symptom-based
    channel: "#alerts"
    owner: AI Team
    runbook: docs/alerts.md#alert-3
